<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDucation</title>
<meta name="description" content="Lecture summaries for medical students at Hawler Medical University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17140F; --ink-2:#5F584E; --ink-3:#8A8378;
  --line:#E5DFD4; --paper:#FDFCF9; --card:#FFFFFF;
  --subject:#1B6E48; --tint:#E7F1EB;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gutter:20px; --radius:10px;
  --shadow:rgba(23,20,15,.07);
  --barbg:rgba(253,252,249,.94);
}
[data-theme="dark"]{
  --ink:#EDE7DB; --ink-2:#A69E90; --ink-3:#7C7568;
  --line:#302B23; --paper:#15130F; --card:#1D1A15;
  --shadow:rgba(0,0,0,.4);
  --barbg:rgba(21,19,15,.94);
}
.themebtn{background:none;border:0;padding:6px;margin-left:auto;cursor:pointer;
  color:var(--ink-2);display:flex;align-items:center;border-radius:6px;line-height:0}
.themebtn:hover{color:var(--subject);background:var(--tint)}
.themebtn svg{width:18px;height:18px;display:block}
.masthead__back{font-size:13px;color:var(--ink-2);
  text-decoration:none;font-family:var(--mono)}
.masthead__right{margin-left:auto;display:flex;align-items:center;gap:12px}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--subject);outline-offset:3px;border-radius:3px}
.wrap{width:100%;max-width:620px;margin:0 auto;padding:0 var(--gutter)}

.masthead{border-bottom:1px solid var(--line);background:var(--card)}
.masthead__inner{display:flex;align-items:center;gap:10px;height:58px;text-decoration:none}
.mark{width:26px;height:26px;flex:none;color:var(--subject)}
.mark svg{display:block;width:100%;height:100%}
.wordmark{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.wordmark em{font-style:normal;color:var(--subject)}
.masthead__back{text-decoration:none}
.masthead__back:hover{color:var(--subject)}

.pagehead{padding:34px 0 26px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--subject);margin:0 0 10px}
.pagehead h1{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:600;
  letter-spacing:-.015em;margin:0 0 8px}
.pagehead p{margin:0;color:var(--ink-2);font-size:15px}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.crumb a{color:var(--ink-3);text-decoration:none}
.crumb a:hover{color:var(--subject)}

.seclabel{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
section+section,.subjgrid+section{margin-top:44px}

.blockcard{display:block;background:var(--card);border:1px solid var(--line);
  border-left:5px solid var(--subject);border-radius:var(--radius);
  padding:18px 18px 16px;text-decoration:none;margin-bottom:12px;
  transition:transform .14s ease,box-shadow .14s ease}
.blockcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--shadow)}
.blockcard__subject{font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--subject)}
.blockcard__title{font-family:var(--serif);font-size:22px;font-weight:600;
  letter-spacing:-.01em;margin:3px 0 0}
.blockcard__count{font-size:13px;color:var(--ink-2)}
.dots{display:flex;gap:6px;margin:12px 0 9px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot--on{background:var(--subject)}

/* ---------- progress ---------- */
.progresswrap{margin:12px 0 10px}
.progressbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.progressfill{height:100%;border-radius:5px;transition:width .35s ease,background-color .35s ease}
.progressmeta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:11.5px;color:var(--ink-2);margin-top:6px;font-family:var(--mono)}
.progressmeta__msg{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progressmeta--big{font-size:13px;margin-top:8px}

.subjgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subjcard{display:block;text-decoration:none;background:var(--card);
  border:1px solid var(--line);border-top:3px solid var(--subject);
  border-radius:var(--radius);padding:14px;
  transition:transform .14s ease,box-shadow .14s ease}
a.subjcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--shadow)}
.subjcard__name{font-family:var(--serif);font-size:17px;font-weight:600;
  letter-spacing:-.01em;line-height:1.25}
.subjcard__count{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--subject);margin-top:5px}
.subjcard--empty{border-top-color:var(--line);opacity:.5}
.subjcard--empty .subjcard__count{color:var(--ink-3)}
@media (max-width:400px){.subjgrid{grid-template-columns:1fr}}

.spine{list-style:none;margin:0;padding:0}
.spine li{position:relative;padding-left:30px}
.spine li::before{content:"";position:absolute;left:6px;top:0;bottom:0;
  width:1px;background:var(--line)}
.spine li:first-child::before{top:26px}
.spine li:last-child::before{bottom:calc(100% - 26px)}
.node{position:absolute;left:0;top:20px;width:13px;height:13px;border-radius:50%;
  border:2px solid var(--line);background:var(--paper)}
.node--done{border-color:var(--subject);background:var(--subject)}

.lecrow-flex{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.spine li:last-child .lecrow-flex{border-bottom:0}
.lecrow{display:block;text-decoration:none;padding:16px 0;flex:1;min-width:0}
.lecrow__code{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
a.lecrow .lecrow__code{color:var(--subject)}
.lecrow__title{font-family:var(--serif);font-size:18px;font-weight:600;
  line-height:1.3;margin:2px 0 4px}
.lecrow__meta{font-size:13px;color:var(--ink-2)}
.lecrow--soon{opacity:.55}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:3px;
  background:var(--tint);color:var(--subject)}
.tag--soon{background:var(--line);color:var(--ink-3)}

.lecchk{display:flex;align-items:center;justify-content:center;padding:6px;
  cursor:pointer;flex:none}
.lecchk input{width:20px;height:20px;accent-color:var(--subject);cursor:pointer}

.examcard{display:block;text-decoration:none;background:var(--tint);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.examcard__title{font-family:var(--serif);font-size:20px;font-weight:600;margin:4px 0 6px}
.examcard__meta{font-size:13.5px;color:var(--ink-2)}

.btn{display:inline-block;background:var(--subject);color:#fff;text-decoration:none;
  font-size:14px;font-weight:500;padding:10px 18px;border-radius:7px;white-space:nowrap;
  border:0;cursor:pointer;font-family:var(--sans)}
.btn:hover{filter:brightness(1.08)}
.btn--quiet{background:transparent;color:var(--subject);border:1px solid var(--subject)}

.downloadbar{position:fixed;left:0;right:0;bottom:0;background:var(--barbg);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:11px var(--gutter) calc(11px + env(safe-area-inset-bottom));z-index:20}
.downloadbar__inner{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.downloadbar__label{font-size:13px;color:var(--ink-2);flex:1;min-width:0}

.notice{border-left:3px solid var(--subject);padding:2px 0 2px 14px;margin:24px 0;
  font-size:14px;color:var(--ink-2)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px 20px;
  text-align:center;color:var(--ink-2);font-size:14.5px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
  padding-top:20px;border-top:1px solid var(--line);font-size:14px}
.pager a{text-decoration:none;color:var(--subject)}
.pager span{color:var(--ink-3)}
.review{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.review button{font-family:var(--mono);font-size:12px;border:1px solid var(--line);
  border-radius:20px;padding:5px 12px;color:var(--ink-2);background:var(--card);
  cursor:pointer;transition:background-color .14s ease,color .14s ease,border-color .14s ease}
.review button:hover{border-color:var(--subject);color:var(--subject)}
.review button.review--on{background:var(--subject);border-color:var(--subject);color:#fff}
.foot{margin-top:56px;padding:22px 0 34px;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-3)}
.foot strong{color:var(--ink-2);font-weight:500}
main.haspdf{padding-bottom:90px}
.pdfview{width:100%;height:80vh;min-height:520px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff;display:block;margin:0}
.pdfcard{display:block;text-decoration:none;background:var(--tint);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;text-align:center;margin:14px 0 0}
.pdfcard:first-of-type{margin-top:20px}
.pdfcard__title{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px}
.pdfcard__meta{font-size:13.5px;color:var(--ink-2);margin-bottom:14px}

.restabs{display:flex;gap:6px;margin:20px 0 0}
.restab{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 15px;border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none;
  background:var(--tint);color:var(--ink-2);cursor:pointer}
.restab--on{background:var(--card);color:var(--subject);font-weight:600}

/* ---------- resource list (lecture / summary / mcq rows) ---------- */
.reslist{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.resrow{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 12px 14px}
.resrow--on{border-color:var(--subject)}
.resrow__icon{flex:none;width:34px;height:34px;border-radius:8px;background:var(--tint);
  color:var(--subject);display:flex;align-items:center;justify-content:center}
.resrow__icon svg{width:17px;height:17px}
.resrow__main{flex:1;min-width:0;text-decoration:none;color:inherit;cursor:pointer}
.resrow__title{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.resrow__meta{font-size:12.5px;color:var(--ink-2);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dlbtn{flex:none;display:flex;align-items:center;gap:6px;background:var(--subject);color:#fff;
  border:0;border-radius:7px;padding:9px 13px;font-family:var(--sans);font-size:12.5px;
  font-weight:500;cursor:pointer;white-space:nowrap}
.dlbtn:hover{filter:brightness(1.08)}
.dlbtn svg{width:14px;height:14px;flex:none}
.dlbtn--busy{opacity:.6;pointer-events:none}

@media (min-width:700px){.pagehead h1{font-size:36px}.pagehead{padding:46px 0 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="masthead__inner">
      <a class="masthead__inner" style="height:auto;flex:0 0 auto" href="#/">
      <span class="mark"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
        stroke-width="5" stroke-linecap="round" aria-hidden="true">
        <circle cx="50" cy="50" r="40"/>
        <path d="M35 28 v14 a15 15 0 0 0 30 0 V28"/>
        <path d="M50 57 v9"/><circle cx="50" cy="72" r="6"/></svg></span>
      <span class="wordmark">MED<em>ucation</em></span>
      </a>
      <span class="masthead__right">
        <a class="masthead__back" id="back" href="#/"></a>
        <button class="themebtn" id="themebtn" type="button"
                aria-label="Switch between light and dark"></button>
      </span>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="pagehead"><p>Loading…</p></div>
</main>

<div id="bar"></div>

<script>
/* [ light colour, light tint, dark colour, dark tint ] */
const THEMES = {
  pathology:   ["#B3322B","#FBEAE8","#E4736A","#2E1D1B"],
  physiology:  ["#1B7A4B","#E4F2EA","#4FBE85","#152A20"],
  micro:       ["#1F5FA8","#E5EEF9","#6FA9EC","#16222F"],
  histology:   ["#6B3FA0","#EFE8F7","#B08EDD","#221A2D"],
  pharm:       ["#C2610A","#FCEDDD","#E89A4E","#2C2015"],
  anatomy:     ["#0F6E72","#E0F0F0","#4FB2B6","#12272A"],
  biochemistry:["#A32552","#FAE7EE","#E2739C","#2B1721"],
  genetics:    ["#3C4A5A","#E9ECEF","#9DACBD","#1C2128"],
  brand:       ["#1B6E48","#E7F1EB","#4FBE85","#152A20"]
};

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>';

let MODE = "light";
let CURRENT = "brand";

function isDark(){ return MODE === "dark"; }
function subjColor(name){
  const t = THEMES[name] || THEMES.brand;
  return isDark() ? t[2] : t[0];
}
function subjTint(name){
  const t = THEMES[name] || THEMES.brand;
  return isDark() ? t[3] : t[1];
}

function applyMode(mode, save){
  MODE = mode;
  document.documentElement.setAttribute("data-theme", mode);
  document.getElementById("themebtn").innerHTML = mode === "dark" ? SUN : MOON;
  if (save) { try { localStorage.setItem("meducation-theme", mode); } catch(e){} }
  theme(CURRENT);
  if (DATA) render();
}

let DATA = null;
let LEC_RES = [];   // resources (summary/lecture) for the lecture page currently open

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function theme(name){
  CURRENT = name;
  document.documentElement.style.setProperty("--subject", subjColor(name));
  document.documentElement.style.setProperty("--tint", subjTint(name));
}

const pub = list => (list || []).filter(l => l.published);

function setBack(label, href){
  const el = document.getElementById("back");
  if (!label){ el.textContent = ""; el.removeAttribute("href"); el.style.display = "none"; return; }
  el.style.display = "";
  el.textContent = label;
  el.setAttribute("href", href);
}

function findBlock(id){ return DATA.blocks.find(b => b.id === id); }
function findSubject(id){ return DATA.subjects.find(s => s.id === id); }
function findLecture(block, subjId, code){
  return (block.subjects[subjId] || []).find(l => slug(l.code) === code);
}

function foot(line, second){
  return `<footer class="foot"><strong>${esc(line)}</strong>${
    second ? "<br>" + esc(second) : ""}</footer>`;
}

/* ---------------- progress tracking (per-browser, localStorage) ---------------- */

function loadProgress(){
  try { return JSON.parse(localStorage.getItem("meducation-progress") || "{}"); }
  catch(e){ return {}; }
}
function saveProgress(p){
  try { localStorage.setItem("meducation-progress", JSON.stringify(p)); } catch(e){}
}
function lectureKey(blockId, subjId, code){ return blockId + "::" + subjId + "::" + code; }

/* spaced-review checkpoints (Day 1 / 3 / 7 / 21 / Pre-exam), per browser */
function loadReview(){
  try { return JSON.parse(localStorage.getItem("meducation-review") || "{}"); }
  catch(e){ return {}; }
}
function saveReview(r){
  try { localStorage.setItem("meducation-review", JSON.stringify(r)); } catch(e){}
}

/* how many published lectures in a block are checked off */
function blockProgress(b){
  const p = loadProgress();
  let total = 0, done = 0;
  DATA.subjects.forEach(sub => {
    pub(b.subjects[sub.id]).forEach(l => {
      total++;
      if (p[lectureKey(b.id, sub.id, l.code)]) done++;
    });
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  return { pct, total, done };
}

function progressMessage(pct){
  if (pct < 20)  return { text: "Pack your bags, buddy.", emoji: "🎒" };
  if (pct < 40)  return { text: "Academic comeback starting soon... right?", emoji: "📉" };
  if (pct < 60)  return { text: "Wait, let him cook.", emoji: "🥣" };
  if (pct < 75)  return { text: "Smells good in here.", emoji: "🥧" };
  if (pct < 90)  return { text: "Certified Chef.", emoji: "🎓" };
  return { text: "Gordon Ramsay is quiet since this dropped", emoji: "🧑‍🍳" };
}

function progressColor(pct){
  if (pct < 20)  return "#B3322B"; // red
  if (pct < 40)  return "#C2610A"; // orange
  if (pct < 60)  return "#D4A017"; // amber
  if (pct < 75)  return "#8BAA3C"; // yellow-green
  if (pct < 90)  return "#1B7A4B"; // green
  return "#B8860B"; // gold — top tier
}

function progressBarHtml(prog, big){
  const msg = progressMessage(prog.pct);
  const col = progressColor(prog.pct);
  return `<div class="progresswrap">
    <div class="progressbar"><div class="progressfill" style="width:${prog.pct}%;background:${col}"></div></div>
    <div class="progressmeta${big ? " progressmeta--big" : ""}">
      <span>${prog.done}/${prog.total} &middot; ${prog.pct}%</span>
      <span class="progressmeta__msg">${msg.emoji} ${esc(msg.text)}</span>
    </div>
  </div>`;
}

function handleCheckboxChange(e){
  const key = e.target.getAttribute("data-key");
  const blockId = e.target.getAttribute("data-block");
  const b = blockId ? findBlock(blockId) : null;
  const before = b ? blockProgress(b).pct : 0;

  const p = loadProgress();
  p[key] = e.target.checked;
  saveProgress(p);

  if (b){
    const after = blockProgress(b).pct;
    if (after >= 90 && before < 90) fireConfetti();
  }
}

function handleReviewClick(e){
  const btn = e.currentTarget;
  const key = btn.getAttribute("data-review-key");
  const r = loadReview();
  r[key] = !r[key];
  saveReview(r);
  btn.classList.toggle("review--on", !!r[key]);
}

function attachInteractive(){
  document.querySelectorAll(".lecchk input[data-key]").forEach(cb => {
    cb.addEventListener("change", handleCheckboxChange);
  });
  document.querySelectorAll(".review button[data-review-key]").forEach(btn => {
    btn.addEventListener("click", handleReviewClick);
  });
}

/* tiny confetti burst, no external dependency */
function fireConfetti(){
  const canvas = document.createElement("canvas");
  canvas.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:999;";
  canvas.width = innerWidth; canvas.height = innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const colors = ["#B3322B","#1B7A4B","#1F5FA8","#6B3FA0","#C2610A","#0F6E72","#B8860B"];
  const pieces = Array.from({ length: 150 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.6,
    r: 4 + Math.random() * 5,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2.2 + Math.random() * 3,
    vx: -1.6 + Math.random() * 3.2,
    rot: Math.random() * 360,
    vr: -7 + Math.random() * 14
  }));
  let start = null;
  function frame(t){
    if (!start) start = t;
    const elapsed = t - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
      ctx.restore();
    });
    if (elapsed < 3000 && canvas.isConnected) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

/* ---------------- resources (original lecture + summary + mcqs) ---------------- */

const RES_ICONS = {
  lecture: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  summary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>',
  mcq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a2.9 2.9 0 0 1 5.7.8c0 1.9-2.6 2.2-2.8 3.7"/><path d="M12 17.2v.1"/></svg>'
};
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>';

/* order students see them: original lecture, then summary, then mcqs */
function resourceList(l){
  const list = [];
  if (l.lecture_pdf) list.push({ type: "lecture", label: "Original Lecture", pdf: l.lecture_pdf, note: l.lecture_note });
  if (l.pdf) list.push({ type: "summary", label: "Summary", pdf: l.pdf, note: l.pdf_note });
  if (l.mcq) list.push({ type: "mcq", label: "MCQs", pdf: l.mcq, note: l.mcq_note });
  return list;
}
function resourceFolder(type){
  return type === "lecture" ? "lectures/" : type === "mcq" ? "mcqs/" : "pdfs/";
}
function resourceSrc(r){
  return resourceFolder(r.type) + encodeURIComponent(r.pdf);
}
function selectResource(idx){
  const r = LEC_RES[idx];
  if (!r) return;
  const iframe = document.getElementById("pdfview");
  if (iframe) iframe.src = resourceSrc(r) + "#view=FitH";
  document.querySelectorAll(".restab").forEach((btn, i) => btn.classList.toggle("restab--on", i === idx));
  document.querySelectorAll(".resrow").forEach((row, i) => row.classList.toggle("resrow--on", i === idx));
}

/* download a resource. On iOS/iPadOS (and any browser with the Web Share
   API for files) this opens the native share sheet so students can save
   straight into Files, a notes app, etc. Falls back to a plain download. */
async function downloadResource(btn){
  const url = btn.getAttribute("data-url");
  const filename = btn.getAttribute("data-filename");
  const original = btn.innerHTML;
  btn.classList.add("dlbtn--busy");
  try{
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("fetch failed");
    const blob = await resp.blob();
    const file = new File([blob], filename, { type: blob.type || "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: filename });
      btn.classList.remove("dlbtn--busy");
      return;
    }
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  } catch(e){
    if (e && e.name === "AbortError"){ btn.classList.remove("dlbtn--busy"); return; }
    // last-resort fallback: plain navigation to the file
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener"; a.target = "_blank";
    document.body.appendChild(a); a.click(); a.remove();
  }
  btn.classList.remove("dlbtn--busy");
  btn.innerHTML = original;
}

/* ---------------- home ---------------- */
function viewHome(){
  theme("brand");
  setBack("", null);
  const s = DATA.site;

  const cards = DATA.blocks.map(b => {
    const total = Object.values(b.subjects).reduce((n,v) => n + pub(v).length, 0);
    const dots = DATA.subjects.map(sub => {
      const on = pub(b.subjects[sub.id]).length > 0;
      const col = on ? subjColor(sub.theme) : "var(--line)";
      return `<span class="dot" style="background:${col}" title="${esc(sub.name)}"></span>`;
    }).join("");
    const count = total ? `${total} summar${total === 1 ? "y" : "ies"}` : "Nothing yet";
    const prog = blockProgress(b);
    const progHtml = prog.total ? progressBarHtml(prog, false) : "";
    return `<a class="blockcard" href="#/b/${b.id}">
      <div class="blockcard__subject">${esc(s.stage)} · ${esc(b.short)}</div>
      <div class="blockcard__title">${esc(b.title)}</div>
      ${progHtml}
      <div class="dots">${dots}</div>
      <div class="blockcard__count">${count} &nbsp;·&nbsp; ${DATA.subjects.length} subjects</div>
    </a>`;
  }).join("");

  const exams = DATA.blocks.filter(b => b.exam).map(b => {
    const e = b.exam;
    return `<a class="examcard" href="#/e/${b.id}" style="--subject:${subjColor(e.theme)};--tint:${subjTint(e.theme)}">
      <div class="blockcard__subject">${esc(b.short)} Block</div>
      <div class="examcard__title">${esc(e.title)}</div>
      <div class="examcard__meta">${e.questions} questions · ${e.minutes} minutes · ${esc(e.note)}</div>
    </a>`;
  }).join("");

  return `<div class="pagehead">
      <p class="eyebrow">${esc(s.stage)}</p>
      <h1>${esc(s.tagline)}</h1>
      <p>${esc(s.subtitle)}</p>
    </div>
    <section><h2 class="seclabel">Blocks</h2>${cards}</section>
    ${exams ? `<section><h2 class="seclabel">Mock exams</h2>${exams}</section>` : ""}
    <p class="notice">Summaries are made to study <strong>alongside</strong> the lecture,
      not instead of it. Read the slides first — only your lecturer knows what he
      stressed out loud.</p>
    ${foot(s.name + " by " + s.author, s.institution)}`;
}

/* ---------------- block ---------------- */
function viewBlock(id){
  const b = findBlock(id);
  if (!b) return viewMissing();
  theme("brand");
  setBack("← blocks", "#/");

  const cards = DATA.subjects.map(sub => {
    const n = pub(b.subjects[sub.id]).length;
    if (!n) return `<div class="subjcard subjcard--empty">
        <div class="subjcard__name">${esc(sub.name)}</div>
        <div class="subjcard__count">Nothing yet</div></div>`;
    return `<a class="subjcard" href="#/s/${b.id}/${sub.id}" style="--subject:${subjColor(sub.theme)};--tint:${subjTint(sub.theme)}">
        <div class="subjcard__name">${esc(sub.name)}</div>
        <div class="subjcard__count">${n} summar${n === 1 ? "y" : "ies"}</div></a>`;
  }).join("");

  let exam = "";
  if (b.exam){
    exam = `<section><h2 class="seclabel">When the block ends</h2>
      <a class="examcard" href="#/e/${b.id}" style="--subject:${subjColor(b.exam.theme)};--tint:${subjTint(b.exam.theme)}">
        <div class="blockcard__subject">Mock exam</div>
        <div class="examcard__title">${esc(b.exam.title)}</div>
        <div class="examcard__meta">${b.exam.questions} questions · ${b.exam.minutes} minutes · ${esc(b.exam.note)}</div>
      </a></section>`;
  }

  const prog = blockProgress(b);
  const progHtml = prog.total ? progressBarHtml(prog, true) : "";

  return `<div class="pagehead">
      <p class="eyebrow">${esc(DATA.site.stage)} · ${esc(b.short)}</p>
      <h1>${esc(b.title)}</h1><p>Pick a subject.</p>
      ${progHtml}
    </div>
    <div class="subjgrid">${cards}</div>${exam}
    ${foot(b.title + " Block · MEDucation by " + DATA.site.author)}`;
}

/* ---------------- subject ---------------- */
function viewSubject(blockId, subjId){
  const b = findBlock(blockId), sub = findSubject(subjId);
  if (!b || !sub) return viewMissing();
  theme(sub.theme);
  setBack("← " + b.short, "#/b/" + b.id);

  const list = b.subjects[subjId] || [];
  const done = pub(list).length;
  const progress = loadProgress();

  const inner = !list.length
    ? `<div class="empty">No summaries for this subject yet.<br>
        They appear here as the lectures happen.</div>`
    : `<ul class="spine">${list.map(l => {
        if (!l.published){
          return `<li><span class="node"></span>
            <div class="lecrow-flex">
              <div class="lecrow lecrow--soon">
                <div class="lecrow__code">${esc(l.code)}</div>
                <div class="lecrow__title">${esc(l.title)}</div>
                <div class="lecrow__meta"><span class="tag tag--soon">Coming</span></div>
              </div>
            </div></li>`;
        }
        const key = lectureKey(b.id, subjId, l.code);
        const checked = !!progress[key];
        return `<li><span class="node node--done"></span>
            <div class="lecrow-flex">
              <a class="lecrow" href="#/l/${b.id}/${sub.id}/${slug(l.code)}">
                <div class="lecrow__code">${esc(l.code)}</div>
                <div class="lecrow__title">${esc(l.title)}</div>
                <div class="lecrow__meta">${l.lecturer ? esc(l.lecturer) + " &nbsp;·&nbsp; " : ""}<span class="tag">Read</span></div>
              </a>
              <label class="lecchk" title="Mark as studied">
                <input type="checkbox" data-key="${key}" data-block="${b.id}" ${checked ? "checked" : ""}>
              </label>
            </div></li>`;
      }).join("")}</ul>`;

  return `<div class="pagehead">
      <p class="crumb"><a href="#/b/${b.id}">${esc(b.short)}</a> &nbsp;/&nbsp; ${esc(sub.name)}</p>
      <h1>${esc(sub.name)}</h1>
      <p>${list.length ? done + " of " + list.length + " published" : "Nothing published yet"}</p>
    </div>${inner}
    ${foot(sub.name + " · " + b.title + " Block · MEDucation by " + DATA.site.author)}`;
}

/* ---------------- lecture ---------------- */
function viewLecture(blockId, subjId, code){
  const b = findBlock(blockId), sub = findSubject(subjId);
  if (!b || !sub) return viewMissing();
  const list = b.subjects[subjId] || [];
  const l = findLecture(b, subjId, code);
  if (!l) return viewMissing();

  theme(sub.theme);
  setBack("← " + sub.name, "#/s/" + b.id + "/" + sub.id);

  const i = list.indexOf(l);
  const prev = [...list.slice(0,i)].reverse().find(x => x.published);
  const next = list.slice(i+1).find(x => x.published);
  const pending = list[i+1];

  const left = prev
    ? `<a href="#/l/${b.id}/${sub.id}/${slug(prev.code)}">← ${esc(prev.code)}</a>`
    : `<span>← First one</span>`;
  const right = next
    ? `<a href="#/l/${b.id}/${sub.id}/${slug(next.code)}">${esc(next.code)} →</a>`
    : pending ? `<span>${esc(pending.code)} coming</span>` : `<span>End of subject</span>`;

  const resources = resourceList(l);
  let notes;

  if (Array.isArray(l.notes) && l.notes.length){
    notes = `<ul>${l.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
  } else if (resources.length){
    LEC_RES = resources;
    const narrow = window.matchMedia("(max-width: 780px)").matches;

    const rows = `<ul class="reslist">${resources.map((r,idx) => `
        <li class="resrow${idx === 0 ? " resrow--on" : ""}">
          <span class="resrow__icon">${RES_ICONS[r.type] || RES_ICONS.summary}</span>
          <a class="resrow__main" href="${resourceSrc(r)}" target="_blank" rel="noopener"
             onclick="${narrow ? "" : `return selectResourceClick(event, ${idx})`}">
            <div class="resrow__title">${esc(r.label)}</div>
            <div class="resrow__meta">${esc(r.note || "PDF")}</div>
          </a>
          <button type="button" class="dlbtn" data-url="${resourceSrc(r)}"
                  data-filename="${esc(r.pdf)}" onclick="downloadResource(this)">
            ${DL_ICON}<span>Download</span>
          </button>
        </li>`).join("")}</ul>`;

    const preview = !narrow
      ? `<iframe id="pdfview" class="pdfview" style="margin-top:16px"
           src="${resourceSrc(resources[0])}#view=FitH" title="${esc(l.title)}"></iframe>`
      : "";

    notes = rows + preview;
  } else {
    notes = `<div class="empty">Nothing attached to this one yet.</div>`;
  }

  const reviewDays = ["Day 1","Day 3","Day 7","Day 21","Pre-exam"];
  const reviewProgress = loadReview();
  const reviewKeyBase = lectureKey(b.id, sub.id, l.code);
  const review = `<div class="review">${reviewDays.map(day => {
    const k = reviewKeyBase + "::" + day;
    const on = !!reviewProgress[k];
    return `<button type="button" class="review--btn${on ? " review--on" : ""}" data-review-key="${esc(k)}">${esc(day)}</button>`;
  }).join("")}</div>`;

  return `<div class="pagehead">
      <p class="crumb"><a href="#/b/${b.id}">${esc(b.short)}</a> &nbsp;/&nbsp;
        <a href="#/s/${b.id}/${sub.id}">${esc(sub.name)}</a> &nbsp;/&nbsp; ${esc(l.code)}</p>
      <h1>${esc(l.title)}</h1><p>${esc(l.lecturer || "")}</p></div>
    ${notes}
    <h2 class="seclabel" style="margin-top:34px">Spaced review</h2>
    <p style="margin:0 0 4px;font-size:13px;color:var(--ink-2)">Tap a day once you've reviewed this lecture again.</p>
    ${review}
    <div class="pager">${left}${right}</div>
    ${foot(sub.name + " · " + b.title + " Block · MEDucation by " + DATA.site.author,
           "Study alongside the lecture, not instead of it.")}`;
}

function selectResourceClick(evt, idx){
  evt.preventDefault();
  selectResource(idx);
  return false;
}

/* ---------------- exam ---------------- */
function viewExam(blockId){
  const b = findBlock(blockId);
  if (!b || !b.exam) return viewMissing();
  const e = b.exam;
  theme(e.theme || "brand");
  setBack("← " + b.short, "#/b/" + b.id);

  return `<div class="pagehead">
      <p class="eyebrow">${esc(b.short)} Block</p>
      <h1>${esc(e.title)}</h1>
      <p>${e.questions} questions · ${e.minutes} minutes · one attempt</p></div>
    <ul>
      <li>The timer starts when you press begin and does not pause.</li>
      <li>You can move between questions freely and change answers.</li>
      <li>It submits itself when the time runs out.</li>
      <li>Your score and the answers appear as soon as you submit.</li>
    </ul>
    ${e.state === "closed"
      ? `<p class="notice">Not open yet. The exam ${esc(e.note)}.</p>`
      : `<p style="margin-top:26px"><a class="btn" href="#/e/${b.id}">Begin</a></p>`}
    <p style="margin-top:26px">
      <a class="btn btn--quiet" href="#/b/${b.id}">Back to ${esc(b.short)}</a></p>
    ${foot("MEDucation by " + DATA.site.author)}`;
}

function viewMissing(){
  theme("brand");
  setBack("← blocks", "#/");
  return `<div class="pagehead"><h1>Not found</h1>
    <p>That page doesn't exist, or it hasn't been published yet.</p></div>
    <p><a class="btn" href="#/">Back to the blocks</a></p>`;
}

/* ---------------- router ---------------- */
function render(){
  const app = document.getElementById("app");
  document.getElementById("bar").innerHTML = "";
  app.classList.remove("haspdf");
  LEC_RES = [];

  const p = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  let html;
  if (!p.length)                    html = viewHome();
  else if (p[0] === "b" && p[1])     html = viewBlock(p[1]);
  else if (p[0] === "s" && p[2])     html = viewSubject(p[1], p[2]);
  else if (p[0] === "l" && p[3])     html = viewLecture(p[1], p[2], p[3]);
  else if (p[0] === "e" && p[1])     html = viewExam(p[1]);
  else                              html = viewMissing();

  app.innerHTML = html;
  attachInteractive();
  window.scrollTo(0, 0);
}

addEventListener("hashchange", render);

let saved = null;
try { saved = localStorage.getItem("meducation-theme"); } catch(e){}
applyMode(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), false);
document.getElementById("themebtn").addEventListener("click", () => {
  applyMode(isDark() ? "light" : "dark", true);
});

fetch("content.json?v=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; render(); })
  .catch(err => {
    document.getElementById("app").innerHTML =
      `<div class="pagehead"><h1>Couldn't load the summaries</h1>
       <p>content.json didn't load (${esc(err.message)}). If you're opening this file
       straight from Finder, that's expected — it only works over a web address.</p></div>`;
  });
</script>
